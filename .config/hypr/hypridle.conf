# OLED-friendly idle policy: dim -> lock -> screen off.
general {
    lock_cmd = pidof -x noctalia >/dev/null && noctalia msg session lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 2 min: dim to 15% (saves brightness first so it can be restored)
listener {
    timeout = 120
    on-timeout = brightnessctl -d amdgpu_bl1 -s set 15%
    on-resume = brightnessctl -d amdgpu_bl1 -r
}

# 4 min: lock
listener {
    timeout = 240
    on-timeout = loginctl lock-session
}

# 5 min: screen off (stops static content burning in)
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
