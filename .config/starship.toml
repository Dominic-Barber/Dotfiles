# Insert a blank line between shell prompts
add_newline = true

# Configure the prompt format
format = """
[╭─](bold blue)$directory$git_branch$git_status$nodejs
[╰─$character](bold blue) """

[directory]
style = "bold cyan"
truncate_to_repo = true

[git_branch]
style = "bold purple"
symbol = " "

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
symbol = " "
style = "bold green"
format = 'via [$symbol($version )]($style)'

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
